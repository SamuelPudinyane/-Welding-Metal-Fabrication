services:
  - type: web
    name: welding-and-metal-fabrication
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /health
    domains:
      - weldingandmetalfabrication.co.za
    envVars:
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        sync: false

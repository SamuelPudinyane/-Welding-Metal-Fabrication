services:
  - type: web
    name: welding-metal-fabrication
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    autoDeployTrigger: commit
    domains:
      - weldingandmetalfabrication.co.za
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
